[package]
name = "shard"
version = "0.5.1"
description = "Shard Launcher — Minecraft: Java Edition launcher"
license = "MIT"
repository = "https://github.com/Asd1if/Shard-Launcher"
authors = ["Asd1if"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "fs", "process", "io-util", "macros", "time", "rt-multi-thread", "net"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.30", default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
