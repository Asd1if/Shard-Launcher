name: CI

# Проверка на каждый push и pull request: типы TypeScript, сборка Rust и тесты на Windows и Linux.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit -p .

      - name: Frontend build
        run: npx vite build

      - name: Rust check and tests
        working-directory: src-tauri
        shell: bash
        env:
          SHARD_PUBLIC_BUILD: "1"
        run: |
          cargo check --locked
          cargo test --lib --locked
